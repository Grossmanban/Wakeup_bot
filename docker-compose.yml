services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wakeup
      POSTGRES_USER: wakeup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wakeup"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://wakeup:${POSTGRES_PASSWORD}@db:5432/wakeup
      MEDIA_DIR: /media
    volumes:
      - media:/media
    depends_on:
      db:
        condition: service_healthy

  bot:
    build: ./backend
    restart: unless-stopped
    command: ["python", "-m", "bot.main"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://wakeup:${POSTGRES_PASSWORD}@db:5432/wakeup
      MEDIA_DIR: /media
    volumes:
      - media:/media
    depends_on:
      api:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?задайте DOMAIN в .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
    depends_on:
      - api

volumes:
  pgdata:
  media:
  caddy_data:
