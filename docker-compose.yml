# Имя проекта задано явно: контейнеры и тома (wakeup-*) не пересекаются с другими
# приложениями на том же сервере.
name: wakeup

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wakeup
      POSTGRES_USER: wakeup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wakeup"]
      interval: 5s
      retries: 10

  api:
    build:
      context: ./backend
      args:
        WITH_OCR: ${WITH_OCR:-1}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://wakeup:${POSTGRES_PASSWORD}@db:5432/wakeup
      MEDIA_DIR: /media
    volumes:
      - media:/media
    depends_on:
      db:
        condition: service_healthy

  bot:
    build:
      context: ./backend
      args:
        WITH_OCR: ${WITH_OCR:-1}
    restart: unless-stopped
    command: ["python", "-m", "bot.main"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://wakeup:${POSTGRES_PASSWORD}@db:5432/wakeup
      MEDIA_DIR: /media
    volumes:
      - media:/media
    depends_on:
      api:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        CADDY_MODE: ${CADDY_MODE:-standard}
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?задайте DOMAIN в .env}
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN:-}
    ports:
      # Если 80/443 заняты другим сервисом, install.sh задаёт, например,
      # HTTP_PUBLISH=127.0.0.1:18080 и HTTPS_PUBLISH=8443 (режим CADDY_MODE=duckdns).
      - "${HTTP_PUBLISH:-80}:80"
      - "${HTTPS_PUBLISH:-443}:443"
    volumes:
      - caddy_data:/data
    depends_on:
      - api

volumes:
  pgdata:
  media:
  caddy_data:
